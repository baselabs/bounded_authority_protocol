name: Dependency review

# Every kci/<sha> qualification run compares the default branch with the candidate
# commit. Dependency review is part of the gate for every change.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    name: Vulnerability and license review
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 0.2 min, run 44145068716.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          base-ref: ${{ github.event.repository.default_branch }}
          head-ref: ${{ github.sha }}
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MIT-0,
            0BSD,
            MPL-2.0,
            PSF-2.0,
            Python-2.0,
            Python-2.0.1
          # typing-extensions declares PSF-2.0 (its PyPI license expression); GitHub's detection
          # also reads the GPL row in the license file's Python release-history table.
          allow-dependencies-licenses: pkg:pypi/typing-extensions
