name: Dependency review

on:
  pull_request:
  push:
    branches:
      - main
      - "kci/**"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Vulnerability and license review
    runs-on: ${{ vars.BASELABS_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Pull requests use the action's own base and head. A push to main compares with the
          # commit it replaced; a kci landing branch compares with the default branch.
          base-ref: ${{ github.ref == 'refs/heads/main' && github.event.before || github.event.repository.default_branch }}
          head-ref: ${{ github.sha }}
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: >-
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            CC0-1.0,
            ISC,
            MIT,
            MPL-2.0
