name: Supply chain

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and attest CI package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"

      - name: Install dependencies
        run: mix deps.get

      - name: Run complete quality gate
        run: mix quality

      - name: Build exact unpublished archive
        # Derive the artifact name from mix.exs @version — a hardcoded filename is the
        # quiet-mislabel class (the docs-currency test pins this derivation).
        run: |
          VERSION="$(grep -m1 '@version ' mix.exs | sed -E 's/.*@version "([^"]+)".*/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mix hex.build --output "artifacts/bounded_authority_protocol-$VERSION.tar"

      - name: Record archive checksum
        working-directory: artifacts
        run: |
          sha256sum "bounded_authority_protocol-$VERSION.tar" > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/bounded_authority_protocol-${{ env.VERSION }}.tar

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/bounded_authority_protocol-${{ env.VERSION }}.tar
          sbom-path: artifacts/release.cdx.json

      - name: Upload CI package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-authority-protocol-${{ github.sha }}
          path: |
            artifacts/bounded_authority_protocol-${{ env.VERSION }}.tar
            artifacts/release.cdx.json
            artifacts/tooling.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
