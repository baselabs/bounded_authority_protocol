name: Supply chain

on:
  push:
    branches:
      - main
      - "kci/**"
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

env:
  BAP_REQUIRE_FULL_HISTORY: "1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build CI package
    outputs:
      version: ${{ steps.archive.outputs.version }}
    runs-on: ${{ vars.BASELABS_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"

      - name: Pin the Hex client
        # The Hex version is written into the archive metadata; .hex-version keeps CI, the
        # attestation and a local release build on the same client.
        run: mix local.hex "$(cat .hex-version)" --force

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same exact release as ci.yml: the Node runners and mutation batteries in
          # `mix quality` require it (.tool-versions).
          node-version: "22.23.1"

      - name: Install verified Gitleaks 8.30.1
        run: |
          scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: mix deps.get

      # ci.yml runs this same gate on main and kci pushes. Manual, scheduled and
      # release-tag runs have no matching CI invocation, so they retain the gate.
      - name: Run complete quality gate
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        run: mix quality

      - name: Generate package SBOMs
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: mix sbom.generate && mix sbom.check

      - name: Build exact unpublished archive
        id: archive
        # Derive the artifact name from mix.exs @version — a hardcoded filename is the
        # quiet-mislabel class (the docs-currency test pins this derivation).
        run: |
          VERSION="$(grep -m1 '@version ' mix.exs | sed -E 's/.*@version "([^"]+)".*/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mix hex.build --output "artifacts/bounded_authority_protocol-$VERSION.tar"

      - name: Record archive checksum
        working-directory: artifacts
        run: |
          sha256sum "bounded_authority_protocol-$VERSION.tar" > SHA256SUMS

      - name: Upload CI package evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-authority-protocol-${{ github.sha }}
          path: |
            artifacts/bounded_authority_protocol-${{ env.VERSION }}.tar
            artifacts/release.cdx.json
            artifacts/tooling.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest trusted package
    needs: package
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.BASELABS_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - name: Download checked package evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bounded-authority-protocol-${{ github.sha }}
          path: artifacts

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/bounded_authority_protocol-${{ env.VERSION }}.tar

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/bounded_authority_protocol-${{ env.VERSION }}.tar
          sbom-path: artifacts/release.cdx.json
