name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks 8.30.1
        run: |
          scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Verify secret-scan sensitivity
        run: scripts/secret_scan.sh --check

      - name: Scan merge-aware history
        run: scripts/secret_scan.sh --history

  workflow-syntax:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  compatibility:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3.4.14"
          - elixir: "1.19.5"
            otp: "28.5.0.3"
          - elixir: "1.20.2"
            otp: "29.0.3"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests and coverage
        run: mix test --cover

  # Tri-platform build bar (ADR 0031): the library contract — clone, deps.get,
  # compile, test — must hold on Windows too. The full `mix quality` battery is
  # POSIX-only tooling (shell gates, Gitleaks, ProVerif, kramdown) and stays on
  # the Linux lanes; this lane proves the portable surface, including the
  # LF-forcing .gitattributes (a default autocrlf checkout would otherwise
  # CRLF-mangle the certified corpora and fail their digest pins).
  windows-build:
    name: Clone-build-test on Windows (tri-platform bar)
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"

      # The independent Node second-implementation runner in `mix test` needs Node
      # (same rationale as the quality job's Node 22).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

  quality:
    name: Complete quality and package boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Active LTS (Node 20 reached end-of-life 2026-04). The independent Node second-
          # implementation runner in `mix quality` runs on this toolchain.
          node-version: "22"

      - name: Install verified Gitleaks 8.30.1
        run: |
          scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: mix deps.get

      - name: Run complete quality gate
        run: mix quality

  spec-render:
    name: Spec renders under pinned kramdown-rfc
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"

      # Pin by version AND gem checksum (the A2 amendment: Ruby gem pinned by version+checksum).
      # The primary .gem is checksum-verified before install; its version-constrained
      # dependencies resolve from rubygems over TLS (--local cannot resolve them).
      - name: Install pinned kramdown-rfc 1.7.40
        run: |
          curl -fsSLo /tmp/kramdown-rfc.gem https://rubygems.org/downloads/kramdown-rfc-1.7.40.gem
          echo "6eac9c860c823a1d47c13c47cff04f91f3c6e02f699f9a64800b4bbf15e6989f  /tmp/kramdown-rfc.gem" | sha256sum -c -
          gem install /tmp/kramdown-rfc.gem

      - name: Render spec/bap-v1.md through kramdown-rfc
        run: kramdown-rfc spec/bap-v1.md > /tmp/bap-v1.xml

      - name: Rendered output is a nonempty xml2rfc v3 document
        run: grep -q '<rfc ' /tmp/bap-v1.xml

  cddl-coherence:
    name: Informative CDDL stays coherent with the corpus
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"

      - name: Install pinned cddl validator 0.12.14 (version + checksum)
        run: |
          curl -fsSLo /tmp/cddl.gem https://rubygems.org/downloads/cddl-0.12.14.gem
          echo "$(cat scripts/cddl-gem.sha256)  /tmp/cddl.gem" | sha256sum -c -
          gem install /tmp/cddl.gem

      - name: Validate the CDDL source itself
        run: |
          ruby -r cddl -e 'CDDL::Parser.new(File.read("spec/cddl/bap-v1.cddl")); puts "cddl parses"'

      - name: Corpus coherence (valid cases parse; invalid exemplars reject)
        run: ruby scripts/check_cddl_coherence.rb

  formal-analysis:
    name: Pinned ProVerif re-run + ledger checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: "5.1"

      # opam depext apt-installs system packages (libgtk2.0-dev et al.); the runner
      # image's apt index can be stale enough that those fetches 404 against the
      # moved Ubuntu archive (observed 2026-09-03). Refresh before installing.
      - name: Refresh apt index for opam depext
        run: sudo apt-get update

      - name: Install pinned ProVerif 2.05
        run: opam install proverif.2.05 -y

      - name: Run the formal harness
        run: opam exec -- scripts/run_formal.sh
