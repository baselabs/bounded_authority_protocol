name: CI

# One push to kci/<sha> qualifies a commit. Every check and attestation belongs to
# this run, without path filters; qualified is green only when every job succeeds.
# main moves to that exact commit after qualification. Pull requests (including
# forks), default-branch pushes, tags and dispatches start no qualification run.
# This public repository uses only GitHub-hosted ubuntu-24.04 runners.
on:
  push:
    branches:
      - "kci/**"

env:
  BAP_REQUIRE_FULL_HISTORY: "1"
  GOTOOLCHAIN: local

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 0.7 min, run 44095267479.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      - name: Install verified Gitleaks 8.30.1
        run: |
          scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Verify secret-scan sensitivity
        run: scripts/secret_scan.sh --check

      - name: Scan merge-aware history
        run: scripts/secret_scan.sh --history

  workflow-syntax:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 1.3 min, run 44145068716.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.golang }}
          cache: false

      - name: Refuse Go version drift
        run: scripts/toolchain.sh --installed golang=${{ steps.toolchain.outputs.golang }}

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  toolchain:
    name: Toolchain versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      beam_matrix: ${{ steps.compatibility.outputs.matrix }}
      sqlite3: ${{ steps.toolchain.outputs.sqlite3 }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Test the shared toolchain reader
        run: scripts/toolchain.sh --self-test

      - name: Build the compatibility matrix
        id: compatibility
        env:
          ELIXIR: ${{ steps.toolchain.outputs.elixir }}
          OTP: ${{ steps.toolchain.outputs.otp }}
          BEAM_LANES: ${{ steps.toolchain.outputs.beam_lanes }}
        run: |
          matrix="$(jq -cn --arg elixir "$ELIXIR" --arg otp "$OTP" --argjson lanes "$BEAM_LANES" '
            {include: (($lanes | to_entries | map(.value + {primary: false, timeout: (if .key == 0 then 19 else 18 end)}))
              + [{elixir: $elixir, otp: $otp, primary: true, timeout: 18}])}')"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  compatibility:
    name: ${{ matrix.primary && 'Elixir and OTP from .tool-versions' || format('Elixir {0} / OTP {1}', matrix.elixir, matrix.otp) }}
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }} # 2x green 9.5/8.7/8.6 min; runs 44109672500/44095313459/44095313459.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.toolchain.outputs.beam_matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ matrix.elixir }} erlang=${{ matrix.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Install SQLite for the approval example
        env:
          SQLITE_VERSION: ${{ needs.toolchain.outputs.sqlite3 }}
        run: scripts/install_sqlite.sh "$SQLITE_VERSION" "$RUNNER_TEMP/bap-sqlite"

      - name: Run tests and coverage
        run: mix test --cover

  quality-source:
    name: "Quality: source, static analysis and docs"
    runs-on: ubuntu-24.04
    timeout-minutes: 7 # 2x slowest green 3.5 min, run 44200170042.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install verified Gitleaks 8.30.1
        run: |
          scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Run source quality stage
        run: mix quality.source

  quality-corpus:
    name: "Quality: corpus and distribution"
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # 2x slowest green 5.6 min, run 44200170042.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The independent Node second-implementation runners in `mix quality` use this
          # exact toolchain, matching .tool-versions. Pinned exactly (the
          # TypeScript repositories pin the same release): node:crypto's Ed25519 verdict on
          # small-order inputs differs across Node releases, so a floating major would make the
          # runners' ungated behavior depend on the runner image (docs/errata.md erratum 2).
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node version drift
        run: scripts/toolchain.sh --installed nodejs=${{ steps.toolchain.outputs.nodejs }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      - name: Install locked SDK environment manager
        run: python -m pip install uv==${{ steps.toolchain.outputs.uv }}

      - name: Refuse uv version drift
        run: scripts/toolchain.sh --installed uv=${{ steps.toolchain.outputs.uv }}

      - name: Set up Go for manifest mutation checks
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.golang }}
          cache: false

      - name: Refuse Go version drift
        run: scripts/toolchain.sh --installed golang=${{ steps.toolchain.outputs.golang }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      # Corpus sync, generator --verify, verdict digests and distribution mutations.
      # Focused tests use separate VMs, preserving the full test --cover --seed 42
      # run in quality-tests. SDK README examples also run against each distributable.
      - name: Run corpus quality stage
        run: mix quality.corpus

  quality-tests:
    name: "Quality: seeded coverage suite and performance"
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # 2x slowest green 9.8 min, run 44200170042.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The independent Node second-implementation runners in `mix quality` use this
          # exact toolchain, matching .tool-versions. Pinned exactly (the
          # TypeScript repositories pin the same release): node:crypto's Ed25519 verdict on
          # small-order inputs differs across Node releases, so a floating major would make the
          # runners' ungated behavior depend on the runner image (docs/errata.md erratum 2).
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node version drift
        run: scripts/toolchain.sh --installed nodejs=${{ steps.toolchain.outputs.nodejs }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Install SQLite for the approval example
        env:
          SQLITE_VERSION: ${{ steps.toolchain.outputs.sqlite3 }}
        run: scripts/install_sqlite.sh "$SQLITE_VERSION" "$RUNNER_TEMP/bap-sqlite"

      - name: Run tests quality stage
        run: mix quality.tests

  quality-conformance:
    name: "Quality: conformance verification and mutations"
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # 2x slowest green 20.0 min, run 44308562166.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The independent Node second-implementation runners in `mix quality` use this
          # exact toolchain, matching .tool-versions. Pinned exactly (the
          # TypeScript repositories pin the same release): node:crypto's Ed25519 verdict on
          # small-order inputs differs across Node releases, so a floating major would make the
          # runners' ungated behavior depend on the runner image (docs/errata.md erratum 2).
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node version drift
        run: scripts/toolchain.sh --installed nodejs=${{ steps.toolchain.outputs.nodejs }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Run conformance quality stage
        run: mix quality.conformance

  quality-mutations:
    name: "Quality: archive, assertion and spec mutations"
    runs-on: ubuntu-24.04
    timeout-minutes: 18 # 2x slowest green 9.0 min, run 44200170042.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The independent Node second-implementation runners in `mix quality` use this
          # exact toolchain, matching .tool-versions. Pinned exactly (the
          # TypeScript repositories pin the same release): node:crypto's Ed25519 verdict on
          # small-order inputs differs across Node releases, so a floating major would make the
          # runners' ungated behavior depend on the runner image (docs/errata.md erratum 2).
          node-version: ${{ steps.toolchain.outputs.nodejs }}
          package-manager-cache: false

      - name: Refuse Node version drift
        run: scripts/toolchain.sh --installed nodejs=${{ steps.toolchain.outputs.nodejs }}

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Run mutations quality stage
        run: mix quality.mutations

  hex-qualification:
    name: Qualify Hex archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # No green run yet for this job.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Qualify the Hex package and documentation
        uses: baselabs/.github/.github/actions/hex-publish@654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2
        env:
          HEX_DOCS_SOURCE_REF: ${{ github.sha }}
        with:
          operation: qualify
          package: bounded_authority_protocol
          package-directory: .

  package:
    name: "Package boundary and attested archive"
    needs: hex-qualification
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.archive.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # No green run yet for the archive handoff.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Run package quality stage
        run: mix quality.package

      # Use the Actions API to read the completed qualification job's artifact in this run.
      - name: Download the exact archive for package checks and attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hex-hexpm-bounded_authority_protocol
          path: ${{ runner.temp }}/qualified-hex
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Name the archive using the qualified version
        id: archive
        run: |
          VERSION="$(jq -er .version "$RUNNER_TEMP/qualified-hex/qualified.json")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$RUNNER_TEMP/qualified-hex/package.tar" "artifacts/bounded_authority_protocol-$VERSION.tar"

      - name: Check the archive used for attestation
        run: mix run --no-start scripts/check_package.exs "artifacts/bounded_authority_protocol-$VERSION.tar"

      - name: Record archive checksum
        working-directory: artifacts
        run: |
          sha256sum "bounded_authority_protocol-$VERSION.tar" > SHA256SUMS
          expected="$(jq -er .package_sha256 "$RUNNER_TEMP/qualified-hex/qualified.json")"
          test "$(cut -d' ' -f1 SHA256SUMS)" = "$expected"

      - name: Upload CI package evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-authority-protocol-${{ github.sha }}
          path: |
            artifacts/bounded_authority_protocol-${{ env.VERSION }}.tar
            artifacts/release.cdx.json
            artifacts/tooling.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Remove downloaded qualification archives
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/qualified-hex"

  spec-render:
    name: Spec renders under pinned kramdown-rfc
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 0.3 min, run 44103442816.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: ${{ steps.toolchain.outputs.ruby }}

      - name: Refuse Ruby version drift
        run: scripts/toolchain.sh --installed ruby=${{ steps.toolchain.outputs.ruby }}

      # Pin by version AND gem checksum (the A2 amendment: Ruby gem pinned by version+checksum).
      # The primary .gem is checksum-verified before install; its version-constrained
      # dependencies resolve from rubygems over TLS (--local cannot resolve them).
      - name: Install pinned kramdown-rfc 1.7.40
        run: |
          curl -fsSLo /tmp/kramdown-rfc.gem https://rubygems.org/downloads/kramdown-rfc-1.7.40.gem
          echo "6eac9c860c823a1d47c13c47cff04f91f3c6e02f699f9a64800b4bbf15e6989f  /tmp/kramdown-rfc.gem" | sha256sum -c -
          gem install /tmp/kramdown-rfc.gem

      # The specification carries no YAML front matter (HexDocs printed it as text); kramdown-rfc
      # needs one, so the render prepends this CI-only header.
      - name: Render spec/bap-v1.md through kramdown-rfc
        run: |
          cat .github/spec-render/bap-v1-front-matter.md spec/bap-v1.md > /tmp/bap-v1.md
          kramdown-rfc /tmp/bap-v1.md > /tmp/bap-v1.xml

      - name: Rendered output is a nonempty xml2rfc v3 document
        run: grep -q '<rfc ' /tmp/bap-v1.xml

  cddl-coherence:
    name: Informative CDDL stays coherent with the corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 0.3 min, run 44095693142.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: ${{ steps.toolchain.outputs.ruby }}

      - name: Refuse Ruby version drift
        run: scripts/toolchain.sh --installed ruby=${{ steps.toolchain.outputs.ruby }}

      - name: Install pinned cddl validator 0.12.14 (version + checksum)
        run: |
          curl -fsSLo /tmp/cddl.gem https://rubygems.org/downloads/cddl-0.12.14.gem
          checksum="$(cat scripts/cddl-gem.sha256)"
          printf '%s  /tmp/cddl.gem\n' "$checksum" | sha256sum -c -
          gem install /tmp/cddl.gem

      - name: Validate the CDDL source itself
        run: |
          ruby -r cddl -e 'CDDL::Parser.new(File.read("spec/cddl/bap-v1.cddl")); puts "cddl parses"'

      - name: Corpus coherence (valid cases parse; invalid exemplars reject)
        run: ruby scripts/check_cddl_coherence.rb

  formal-analysis:
    name: Pinned ProVerif re-run + ledger checks
    runs-on: ubuntu-24.04
    timeout-minutes: 28 # 2x slowest green 13.9 min, run 44305879447; OCaml setup alone varies 4-12 min with or without a cache.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: ${{ steps.toolchain.outputs.ocaml }}
          cache: false

      - name: Refuse OCaml version drift
        run: opam exec -- scripts/toolchain.sh --installed ocaml=${{ steps.toolchain.outputs.ocaml }}

      # opam depext apt-installs system packages (libgtk2.0-dev et al.); the runner
      # image's apt index can be stale enough that those fetches 404 against the
      # moved Ubuntu archive (observed 2026-09-03). Refresh before installing.
      - name: Refresh apt index for opam depext
        run: sudo apt-get update

      - name: Install pinned ProVerif 2.05
        run: opam install proverif.2.05 -y

      - name: Run the formal harness
        run: opam exec -- scripts/run_formal.sh

  sdks:
    name: SDK conformance
    uses: ./.github/workflows/sdks.yml

  sdk-publish-guard:
    name: SDK publish guard
    uses: ./.github/workflows/sdk-publish-guard.yml

  dependency-review:
    name: Dependency review
    # Every candidate is compared with the default branch in its qualification run.
    uses: ./.github/workflows/dependency-review.yml

  attest:
    name: Supply chain
    needs: [quality-source, quality-corpus, quality-tests, quality-conformance, quality-mutations, package]
    # Attestation is part of qualification, after every quality stage job.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/supply-chain.yml
    with:
      version: ${{ needs.package.outputs.version }}

  livebooks-local:
    name: livebooks-local
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; green 0.9 min, run 44308562166.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ steps.toolchain.outputs.elixir }}
          otp-version: ${{ steps.toolchain.outputs.otp }}
          version-type: strict
          install-hex: false

      - name: Refuse BEAM version drift
        run: scripts/toolchain.sh --installed elixir=${{ steps.toolchain.outputs.elixir }} erlang=${{ steps.toolchain.outputs.otp }}

      - name: Install the Hex client pinned by the release action
        working-directory: ${{ runner.temp }}
        run: |
          version="$(curl -fsSL 'https://raw.githubusercontent.com/baselabs/.github/654fcd0ef63daf8e3f79dfeb4ca900adffd0d4e2/.github/actions/hex-publish/hex-version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test ! -e mix.exs
          mix local.hex "$version" --force

      - name: Execute every notebook against the local package
        run: elixir scripts/check_livebooks.exs --local

  qualified:
    if: always()
    needs:
      - secret-scan
      - workflow-syntax
      - toolchain
      - compatibility
      - quality-source
      - livebooks-local
      - quality-corpus
      - quality-tests
      - quality-conformance
      - quality-mutations
      - hex-qualification
      - package
      - spec-render
      - cddl-coherence
      - formal-analysis
      - sdks
      - sdk-publish-guard
      - dependency-review
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 2 sec, run 44200170042.
    steps:
      - name: Require every qualification result to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
