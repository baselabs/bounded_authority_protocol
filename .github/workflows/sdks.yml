name: SDK conformance

# Cross-language verifier SDK gate (ADR 0014 D8). Runs on push/PR touching sdks/** or
# priv/conformance/**, plus manual dispatch and a daily schedule (catches upstream crypto-runtime
# drift). NOT part of the Elixir `mix quality` battery — the SDK suites run in their own job to
# avoid runner starvation during the quality gate.

on:
  pull_request:
    paths:
      - "sdks/**"
      - "priv/conformance/**"
      - ".github/workflows/sdks.yml"
  push:
    branches:
      - main
    paths:
      - "sdks/**"
      - "priv/conformance/**"
      - ".github/workflows/sdks.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdks-conformance:
    name: Cross-language SDK conformance (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # The SDK targets Node >= 22 (the active LTS line; Node 20 reached end-of-life 2026-04).
      # Verify against both the active LTS (22) and the current release line (24) so a runtime
      # regression on either is caught. The Python steps re-run per Node version — they do not
      # depend on Node (<1s of waste) and keeping a single self-contained job is clearer than a
      # two-job split for this surface size.
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      # --- TypeScript SDK gate ---
      - name: TS — install
        run: pnpm install --frozen-lockfile
        working-directory: sdks/typescript

      - name: TS — typecheck
        run: pnpm typecheck
        working-directory: sdks/typescript

      - name: TS — lint (purity rule)
        run: pnpm lint
        working-directory: sdks/typescript

      - name: TS — license check
        run: pnpm license-check
        working-directory: sdks/typescript

      - name: TS — unit + permissiveness tests
        run: pnpm test && pnpm test:permissiveness
        working-directory: sdks/typescript

      - name: TS — conformance (280 + census)
        run: pnpm conformance
        working-directory: sdks/typescript

      # --- Python SDK gate ---
      - name: Python — install
        run: |
          python -m pip install --upgrade pip
          # Pinned toolchain (cross-vendor #23): a floating `pip install cryptography ruff mypy
          # pytest` lets the security/conformance gate's executable supply chain change without a
          # repository diff. Pin to the exact versions the gate is verified against; bumping any of
          # these is a deliberate, reviewed change.
          pip install cryptography==50.0.0 ruff==0.16.2 mypy==2.3.0 pytest==9.1.1
          pip install -e . --no-deps
        working-directory: sdks/python

      - name: Python — typecheck (mypy --strict)
        run: mypy src/
        working-directory: sdks/python

      - name: Python — lint
        run: ruff check src/ tests/ tools/
        working-directory: sdks/python

      - name: Python — purity check
        run: python tools/purity_check.py
        working-directory: sdks/python

      - name: Python — license check
        run: python tools/license_check.py
        working-directory: sdks/python

      - name: Python — unit + permissiveness tests
        run: python -m pytest tests/ -q
        working-directory: sdks/python

      - name: Python — conformance (280 + census)
        run: python tests/conformance/run.py
        working-directory: sdks/python
