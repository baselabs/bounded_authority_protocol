name: SDK conformance

# Cross-language SDK conformance, purity, and permissive-dependency gates.
# CI calls this workflow on every
# kci/<sha> qualification run without path filters. These suites run separately
# from the Elixir mix quality battery.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  sdks-conformance:
    name: Cross-language SDK conformance (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; green 1.3 min, run 44308562166.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      # The TypeScript SDK graduated to its own repository on first publication
      # (sdks/README.md publication boundary, 2026-09-14): baselabs/bounded_authority_protocol_typescript
      # carries its CI, conformance, and npm releases now.

      # --- Python SDK gate ---
      - name: Install locked SDK environment manager
        run: python -m pip install uv==${{ steps.toolchain.outputs.uv }}

      - name: Refuse uv version drift
        run: scripts/toolchain.sh --installed uv=${{ steps.toolchain.outputs.uv }}

      - name: "Python: install"
        run: |
          uv sync --locked
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        working-directory: sdks/python

      - name: "Python: audit the locked dependency set"
        working-directory: sdks/python
        run: |
          audit_dir=$(mktemp -d)
          trap 'rm -rf "$audit_dir"' EXIT
          # PEP 751 keeps every platform/Python variant, including multiple locked versions
          # of one package. pip-audit's native lock reader audits all of them.
          uv export --locked --all-groups --no-emit-project --format pylock.toml --output-file "$audit_dir/pylock.toml"
          uvx --from pip-audit==2.9.0 pip-audit --locked "$audit_dir"

      - name: "Python: audit every declared dependency floor"
        run: python scripts/audit_python_floors.py

      - name: "Python: closure removal must fail"
        run: python scripts/check_sdk_closures.py python

      - name: "Python: typecheck (mypy --strict)"
        run: mypy src/
        working-directory: sdks/python

      - name: "Python: typecheck verifier package (Pyright strict)"
        run: uvx --from pyright==1.1.408 pyright --pythonpath .venv/bin/python
        working-directory: sdks/python

      - name: "Python: lint"
        run: ruff check src/ tests/ tools/ examples/ candidate/
        working-directory: sdks/python

      - name: "Python: purity check"
        run: python tools/purity_check.py
        working-directory: sdks/python

      - name: "Python: license check"
        run: python tools/license_check.py
        working-directory: sdks/python

      - name: "Python: documented empty-project consumer"
        run: python scripts/check_sdk_install.py python

      - name: "Python: unit + permissiveness tests"
        run: python -m pytest tests/ -q
        working-directory: sdks/python

      - name: "Python: conformance (283 + census)"
        run: python tests/conformance/run.py
        working-directory: sdks/python

      - name: "Python: v2 conformance (268 + census)"
        run: python tests/conformance/run_v2.py
        working-directory: sdks/python

      - name: "Python: v3 conformance (292 + census)"
        run: python tests/conformance/run_v3.py
        working-directory: sdks/python

      - name: "Python: source candidate profiles and approval example"
        run: python -m pytest -c sdks/python/pyproject.toml sdks/python/candidate -q

  python-compatibility:
    name: Python compatibility (lane ${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        lane: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ fromJSON(steps.toolchain.outputs.python_lanes)[matrix.lane] }}
      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ fromJSON(steps.toolchain.outputs.python_lanes)[matrix.lane] }}
      - name: Install uv
        run: python -m pip install uv==${{ steps.toolchain.outputs.uv }}
      - name: Refuse uv version drift
        run: scripts/toolchain.sh --installed uv=${{ steps.toolchain.outputs.uv }}
      - name: Install the locked SDK
        run: uv sync --locked --python "$(command -v python)"
        working-directory: sdks/python
      - name: Verify released and candidate profiles
        run: sdks/python/.venv/bin/python -m pytest -c sdks/python/pyproject.toml sdks/python/tests sdks/python/candidate -q
      - name: Enforce approval verification p99
        run: sdks/python/.venv/bin/python sdks/python/candidate/benchmark_approval.py

  # TypeScript runs in its graduated repository. The independent Node runner uses the
  # shared toolchain reader outputs in ci.yml's quality-corpus, quality-tests,
  # quality-conformance and quality-mutations jobs, matching its strict-Ed25519
  # backend evidence; SDK jobs here have no Node dependency.
  # The Rust MSRV is the default rust version in .tool-versions, matching the local
  # rust-toolchain.toml pin. RUSTUP_TOOLCHAIN keeps CI on the reader output.
  rust-conformance:
    name: Cross-language SDK conformance (Rust MSRV 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 8 # 2x green 3.8 min, run 44308562166.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      - name: Install the Rust MSRV with rustfmt and clippy
        run: |
          rustup toolchain install ${{ steps.toolchain.outputs.rust }} --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default ${{ steps.toolchain.outputs.rust }}
          echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.rust }}" >> "$GITHUB_ENV"

      - name: Refuse Rust version drift
        run: scripts/toolchain.sh --installed rust=${{ steps.toolchain.outputs.rust }}

      - name: "Rust: audit Cargo.lock"
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file sdks/rust/Cargo.lock

      - name: "Rust: closure removal must fail"
        run: python3 scripts/check_sdk_closures.py rust

      - name: "Rust: native documentation coverage"
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
        working-directory: sdks/rust

      - name: "Rust: documented path and Git consumers"
        run: python3 scripts/check_sdk_install.py rust

      - name: fmt
        run: cargo fmt --check
        working-directory: sdks/rust

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: sdks/rust

      # `cargo test --locked` runs every test target against the committed
      # Cargo.lock: the lib unit suite, the permissiveness mutation-gate
      # battery, and the conformance runner that asserts agreed=283 disagreed=0
      # + the two-boundary key census. `--locked` makes the exact resolved
      # dependency versions a reviewed repo change, not a per-run resolution.
      - name: unit + permissiveness + conformance (283 + 268 + 292 + census)
        run: cargo test --locked
        working-directory: sdks/rust

      - name: purity check
        run: bash tools/purity_check.sh
        working-directory: sdks/rust

      - name: license check
        run: bash tools/license_check.sh
        working-directory: sdks/rust

  # Go runs as its own job in the same call. The go.mod floor (1.25) is the
  # CI-tested floor: this job installs exactly its .0 release, mirroring the Rust
  # MSRV pattern. Zero runtime dependencies means no go.sum to lock; `go vet` +
  # `go test ./...` cover the library unit suite, the permissiveness
  # mutation-gate battery (incl. the white-box work-pin legs), and the
  # conformance runner that asserts agreed=283 disagreed=0 + the key census
  # against the vendored, startup-SHA-bound corpus snapshot.
  go-conformance:
    name: Cross-language SDK conformance (Go 1.25)
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; green 0.7 min, run 44308562166.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      - name: Read Go SDK floor
        id: go-floor
        env:
          GO_LANES: ${{ steps.toolchain.outputs.golang_lanes }}
        run: |
          golang="$(jq -er '.[0]' <<< "$GO_LANES")"
          printf 'golang=%s\n' "$golang" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-floor.outputs.golang }}
          cache: false

      - name: Refuse Go floor drift
        run: scripts/toolchain.sh --installed golang=${{ steps.go-floor.outputs.golang }}

      - name: "Go: closure removal must fail"
        run: python3 scripts/check_sdk_closures.py go

      - name: "Go: documented empty-project consumer"
        run: python3 scripts/check_sdk_install.py go

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted"
        working-directory: sdks/go

      - name: vet
        run: go vet ./...
        working-directory: sdks/go

      - name: unit + permissiveness + conformance (283 + 268 + 292 + census)
        run: go test ./...
        working-directory: sdks/go

      - name: purity check
        run: bash tools/purity_check.sh
        working-directory: sdks/go

      - name: license check
        run: bash tools/license_check.sh
        working-directory: sdks/go

  # Audit the complete module set, including stdlib, on a supported patched toolchain.
  # The separate conformance job above still proves the declared Go 1.25 floor.
  go-advisories:
    name: Go module advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 0.6 min, run 44095267479.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up patched Go for the advisory scan
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.golang }}
          cache: false

      - name: Refuse Go version drift
        run: scripts/toolchain.sh --installed golang=${{ steps.toolchain.outputs.golang }}

      - name: Audit every module, including packages without reachable symbols
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -scan=module
        working-directory: sdks/go

  isolated-distribution:
    name: Isolated SDK and unpacked package (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }} # Rust: 2x 4.1 min, run 44138809033; Python/Go: 5-minute floor, 2.0/1.0 min, run 44095693142.
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: python
            timeout: 5
          - sdk: rust
            timeout: 9
          - sdk: go
            timeout: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Refuse Python version drift
        run: scripts/toolchain.sh --installed python=${{ steps.toolchain.outputs.python }}

      - if: matrix.sdk == 'python'
        run: python -m pip install uv==${{ steps.toolchain.outputs.uv }}
      - if: matrix.sdk == 'python'
        name: Refuse uv version drift
        run: scripts/toolchain.sh --installed uv=${{ steps.toolchain.outputs.uv }}
      - if: matrix.sdk == 'rust'
        run: |
          rustup toolchain install ${{ steps.toolchain.outputs.rust }} --profile minimal --no-self-update
          rustup default ${{ steps.toolchain.outputs.rust }}
          echo "RUSTUP_TOOLCHAIN=${{ steps.toolchain.outputs.rust }}" >> "$GITHUB_ENV"
      - if: matrix.sdk == 'rust'
        name: Refuse Rust version drift
        run: scripts/toolchain.sh --installed rust=${{ steps.toolchain.outputs.rust }}
      - if: matrix.sdk == 'go'
        name: Read Go SDK floor
        id: go-floor
        env:
          GO_LANES: ${{ steps.toolchain.outputs.golang_lanes }}
        run: |
          golang="$(jq -er '.[0]' <<< "$GO_LANES")"
          printf 'golang=%s\n' "$golang" >> "$GITHUB_OUTPUT"
      - if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-floor.outputs.golang }}
          cache: false
      - if: matrix.sdk == 'go'
        name: Refuse Go floor drift
        run: scripts/toolchain.sh --installed golang=${{ steps.go-floor.outputs.golang }}
      - if: matrix.sdk == 'go'
        name: Cache the module zip verifier
        run: go mod download golang.org/x/mod@v0.29.0
      - run: python3 scripts/check_sdk_distribution.py ${{ matrix.sdk }}
      - run: python3 scripts/check_sdk_corpus_mutations.py ${{ matrix.sdk }}
