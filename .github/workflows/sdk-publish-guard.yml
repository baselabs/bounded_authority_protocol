name: SDK publish guard

# Enforce the separate-repository publication boundary in sdks/README.md. No SDK
# publishes from this monorepo. The local hook (scripts/hooks/pre-commit) gives fast contributor
# feedback; this workflow, which CI calls on every run, is the hard gate. Both use
# the SAME pattern source (scripts/check_sdk_publish_infra.sh), so the two
# cannot drift apart. That script is the authority on which strings are blocked;
# this file intentionally does NOT repeat them (an earlier draft listed them in
# this comment and the checker then matched its own comment text).
#
# This workflow IS a scanned surface (it lives under .github/workflows/), but it
# invokes the checker by path and runs no publish command in any step, so it
# does not self-match.
#
# Honesty limit: this catches publish infrastructure COMMITTED. It cannot catch a
# literal ad-hoc publish run against a working tree. This is the non-bypassable
# layer for committed infrastructure.

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: No SDK publish infrastructure in monorepo
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # 5-minute floor; slowest green 0.2 min, run 44145068716.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read toolchain versions
        id: toolchain
        run: scripts/toolchain.sh >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Run SDK publish guard over every classified path
        env:
          CHECKER: scripts/check_sdk_publish_infra.sh
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          failed = False
          for raw_path in paths:
              if not raw_path:
                  continue
              path = os.fsdecode(raw_path)
              result = subprocess.run(
                  [str(Path(os.environ["CHECKER"]).resolve()), path],
                  input=Path(path).read_bytes(),
                  check=False,
              )
              failed = failed or result.returncode != 0
          if failed:
              sys.exit("SDK publish infrastructure is forbidden in the monorepo (sdks/README.md publication boundary).")
          print("No SDK publish infrastructure found.")
          PYTHON
