[package]
name = "bounded-authority-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Provider-neutral, deterministic, pure verification library for bounded proof-of-possession authority (frozen v1 profile)."
repository = "https://github.com/baselabs/bounded_authority_protocol"
keywords = ["authentication", "authorization", "dpop", "ed25519", "security"]
categories = ["cryptography", "authentication"]

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false }
sha2 = "0.10"
ryu-js = "1.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the v2 corpus carries a float lexeme (4503599627370495.5)
# whose default fast-path parse is off by one ulp; the runner reads corpus
# files through serde_json and must see the correctly-rounded value.
serde_json = { version = "1", features = ["float_roundtrip"] }

# The BAP-15 T14 conformance runner: the acceptance gate that vendors the 283-
# case corpus, dispatches all 28 surfaces through the public façade, SHA-binds
# the vendored index.json, and runs the two-boundary key census. It is an
# integration test living outside `src/` (so it can exercise ONLY the public
# crate surface), declared as an explicit `[[test]]` target so
# `cargo test --test conformance` runs it. serde/serde_json (dev-deps) read the
# corpus JSON into `serde_json::Value`; the runner constructs the `src/` input
# structs field-by-field (the F3 construction seam) — there is NO serde derive
# on any `src/` struct.
[[test]]
name = "conformance"
path = "conformance/run.rs"

# The v2 conformance runner: the contract-major 2 acceptance gate over the
# vendored 268-case corpus-v2 snapshot (same SHA-bind + two-boundary census
# discipline as the v1 runner, against the `v2` façade and the shared
# primitives).
[[test]]
name = "conformance_v2"
path = "conformance/run_v2.rs"
