[package]
name = "bounded-authority-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
# Never published from this repository (ADR 0015): the crate moves to its own repository
# when it is first published.
publish = false
license = "Apache-2.0"
description = "Provider-neutral, deterministic, pure verification library for bounded proof-of-possession authority (contract-majors 1, 2, and 3 and the sibling profiles)."
repository = "https://github.com/baselabs/bounded_authority_protocol"
keywords = ["authentication", "authorization", "dpop", "ed25519", "security"]
categories = ["cryptography", "authentication"]

[dependencies]
ed25519-dalek = { version = "3.0", default-features = false }
# The v3 ES256 backend (contract-major 3, `BAP3-ES256-SHA256`): ECDSA over
# NIST P-256 with SHA-256, verify-only. `default-features = false` matches the
# ed25519-dalek posture (no `pem`/`pkcs8`/`std`/`serde`); the `ecdsa` feature
# pulls the arithmetic + digest machinery `es256.rs` uses (VerifyingKey,
# Signature, verify, AffinePoint). All cryptographic dependencies use the
# RustCrypto sha2 0.11 / digest 0.11 / signature 3 generation.
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
sha2 = "0.11"
ryu-js = "1.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the v2 corpus carries a float lexeme (4503599627370495.5)
# whose default fast-path parse is off by one ulp; the runner reads corpus
# files through serde_json and must see the correctly-rounded value.
serde_json = { version = "1", features = ["float_roundtrip"] }

# The BAP-15 T14 conformance runner: the acceptance gate that vendors the 283-
# case corpus, dispatches all 28 surfaces through the public façade, SHA-binds
# the vendored index.json, and runs the two-boundary key census. It is an
# integration test living outside `src/` (so it can exercise ONLY the public
# crate surface), declared as an explicit `[[test]]` target so
# `cargo test --test conformance` runs it. serde/serde_json (dev-deps) read the
# corpus JSON into `serde_json::Value`; the runner constructs the `src/` input
# structs field-by-field (the F3 construction seam) — there is NO serde derive
# on any `src/` struct.
[[test]]
name = "conformance"
path = "conformance/run.rs"

[[test]]
name = "conformance_producer_canonicality"
path = "conformance/run_producer_canonicality.rs"

# The selector float-zero runner (erratum 6): the vendored additive 161-case
# selector-float-zero snapshot (profile bap-selector-float-zero/1) against
# grant decode, the grant signing-input producer and check_envelope, majors 1-3.
[[test]]
name = "conformance_selector_float_zero"
path = "conformance/run_selector_float_zero.rs"

# The v2 conformance runner: the contract-major 2 acceptance gate over the
# vendored 268-case v2 snapshot (same SHA-bind + two-boundary census
# discipline as the v1 runner, against the `v2` façade and the shared
# primitives).
[[test]]
name = "conformance_v2"
path = "conformance/run_v2.rs"

# The v3 conformance runner: the contract-major 3 acceptance gate over the
# vendored 292-case v3 snapshot (same SHA-bind + two-boundary census
# discipline as the v1/v2 runners, against the `v3` façade, the shared
# primitives, and the v3 ES256 suite surfaces).
[[test]]
name = "conformance_v3"
path = "conformance/run_v3.rs"

# The strict-Ed25519 conformance runner: the acceptance gate over the vendored additive
# 2410-case strict-ed25519 snapshot (profile bap-strict-ed25519/1; same SHA-bind discipline as the
# v1/v2/v3 runners, against the public façades, the strict helpers and the JWK family).
[[test]]
name = "conformance_strict"
path = "conformance/run_strict.rs"

[[test]]
name = "content_assertion"
path = "tests/content_assertion.rs"
