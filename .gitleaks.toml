# Gitleaks 8.30.1 default rules with rule-scoped public-fixture exceptions.
# Every exception requires the target rule, an anchored path, and an exact
# public fixture match. Historical TypeScript exceptions also require the
# original commit, so reintroducing those graduated paths remains detectable.
[extend]
useDefault = true


[[allowlists]]
description = "v3 ES256 corpus public compact JWS fixtures (machine-minted, certified, no private material - the corpus loader's private-material sweep and the certified mint prove it; path-scoped because enumerating a generated corpus's compacts is unmaintainable)"
targetRules = ["jwt", "generic-api-key"]
paths = [
  '''^priv/conformance/v3/corpus/cases/(?:anchored-export|assemble-compact|boundary-anchor|envelope|grant-decode|grant-verify|key-locator|key-transition|proof-decode|signing-input)/[^/]+\.json$''',
  '''^sdks/(?:go|rust)/conformance/corpus-v3/cases/(?:anchored-export|assemble-compact|boundary-anchor|envelope|grant-decode|grant-verify|key-locator|key-transition|proof-decode|signing-input)/[^/]+\.json$''',
]
