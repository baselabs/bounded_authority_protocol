# gitleaks config — extends the default ruleset.
#
# The v1 conformance corpus and vectors ship PUBLIC deterministic test material: compact JWS
# grant/proof/anchor tokens and raw base64url public keys, hashes, and fingerprints, all generated
# from throwaway seeds. They are JWT-shaped and high-entropy by design, so two default rules fire
# on them — 279 findings, every one fixture data: `jwt` (105) on the compact tokens and
# `generic-api-key` (174) on the 32-byte base64url values. Those two rules are allowlisted for
# those two paths. Every other default rule still applies in these trees, and every rule applies
# everywhere else in the repository.
#
# RESIDUAL, measured and stated rather than claimed away: a credential committed under
# priv/conformance/v1/{corpus,vectors} that matches ONLY `jwt` or ONLY `generic-api-key` is NOT
# flagged here. Verified with canaries — a `ghp_…` GitHub token under the corpus path IS caught
# (rule `github-pat`), a 36-character generic key under the same path is NOT. The bounding factor
# is that both directories hold only machine-generated conformance fixtures; nothing is
# hand-authored into them.
#
# A narrower form was attempted and does NOT work in gitleaks 8.30.1: adding
# `regexes = ['^[A-Za-z0-9_-]{43}$']` with `regexTarget = "secret"` and `matchCondition = "AND"`,
# to suppress only the 43-character base64url shape that every one of the 174 generic-api-key
# findings actually has. The regex is silently ignored — with a deliberately impossible pattern
# (`^ZZZNEVERMATCHZZZ$`) the fixtures remain suppressed, proving the path condition alone decides.
# Do not re-add that form believing it narrows anything; it only makes the config read narrower
# than it behaves, which is worse than the honest broad rule scoping below.
#
# Two in-repo checks cover private key material independently of gitleaks: the corpus loader
# requires every case file to declare `provenance.private_material_tracked: false` (schema-pinned
# via priv/conformance/v1/schemas/conformance-case.schema.json), and the cross-verifier census scan
# (conformance/bap03_independent.mjs assertNoPrivateMaterial / discoverTextKeys) rejects PEM blocks,
# Ed25519 private DER, JWK `d` members, and labeled private-key/seed values in the files it walks.
# Neither is exhaustive either: the census walk skips any file named `manifest.json`, and an
# UNLABELED raw seed matches no private-key pattern.
#
# No repository gate consumes this file today — it configures the developer's local commit scan.

[extend]
useDefault = true

[[allowlists]]
description = "conformance fixtures: JWT-shaped tokens and 32-byte base64url public key material"
targetRules = ["jwt", "generic-api-key"]
paths = [
  '''priv/conformance/v1/corpus/.*''',
  '''priv/conformance/v1/vectors/.*''',
]
