# Gitleaks 8.30.1 default rules with rule-scoped public-fixture exceptions.
# Every exception requires the target rule, an anchored path, and an exact
# public fixture match. Historical TypeScript exceptions also require the
# original commit, so reintroducing those graduated paths remains detectable.
[extend]
useDefault = true

