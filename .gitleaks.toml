# gitleaks allowlist — scoped, auditable false positives only.
#
# The specification's generated Appendix A (and its derived view) embeds the
# PUBLISHED conformance-corpus compact JWS test vectors: public-key-only
# fixtures, verifiable against the certified corpus. gitleaks' jwt rule flags
# every compact JWS; these entries allow exactly that shape in exactly the two
# generated documents and nothing else.
title = "bounded_authority_protocol gitleaks config"

[[allowlists]]
description = "Published conformance-corpus compact JWS test vectors (public keys only)"
paths = [
  '''spec/bap-v1\.md''',
  '''docs/protocol-v1\.md''',
]
regexes = ['''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+''']
